<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stepping between Scheme and JavaScript</title>
</head>
<body>
<!--
  The page the DevTools tests drive (tests/devtools/stepping_tests.js): the
  system loaded from its modules, the compiler with it, and a Scheme file and
  a JavaScript module that call each other. Each Scheme procedure is called
  until the tier has compiled it, since a step goes into compiled code; the
  page says which are compiled once it is ready.
-->
<script type="module">
  import { schemeEval, schemeEvalAsync, loadCompiler } from '../../../src/packaging/scheme_entry.js';
  import * as user from './boundary.js';

  window.user = user;
  await loadCompiler();
  const url = new URL('./boundary.scm', document.URL).href;
  await schemeEvalAsync(await (await fetch(url)).text(), { filename: url });
  const procedures = ['scheme-calls-js', 'scheme-called-from-js', 'scheme-round-trip'];
  window.call = (name, ...args) => schemeEval(name)(...args);
  for (let i = 0; i < 3; i++) {
    window.call('scheme-calls-js', i);
    window.call('scheme-called-from-js', i);
    window.call('scheme-round-trip', i);
  }
  window.compiled = Object.fromEntries(procedures.map((name) => [name, schemeEval(name).$compiled === true]));
  window.ready = true;
</script>
</body>
</html>
